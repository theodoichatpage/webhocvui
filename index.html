<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Học Vui - bản dựng lại</title>
<style>
:root{font:14px Inter,system-ui,sans-serif;color:#21474b;background:#e9f9f2}*{box-sizing:border-box}body{margin:0}header{padding:18px 28px;background:#a6e6d4;display:flex;align-items:center;justify-content:space-between}main{max-width:980px;margin:36px auto;padding:0 18px}.panel{background:#fff;border:2px dashed #98cfc3;border-radius:24px;padding:26px;box-shadow:0 12px 28px #357a5920;margin:18px 0}button,select{font:inherit;border:0;border-radius:16px;padding:12px 18px}button{background:#37bea8;color:#fff;cursor:pointer}button:hover{filter:brightness(.95)}button:disabled{opacity:.6}select{background:#e5f6ef}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.hidden{display:none}.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #deeee9;border-radius:18px;padding:16px;margin:10px 0}.choice{display:block;width:100%;text-align:left;background:#dff4eb;color:#215648;margin:10px 0}.correct{background:#aae7be}.wrong{background:#facaca}.muted{color:#6b8983}footer{text-align:center;color:#647a74;padding:20px}
</style></head>
<body><header><strong>🦝 HỌC VUI TIỂU HỌC</strong><button id="theme">🌙 Ngày / Đêm</button></header>
<main><section class="panel" id="welcome"><h1>Chào mừng đến Học Vui!</h1><p>Đây là bản dựng lại thử nghiệm, chưa phải mã nguồn gốc của ChatGPT Sites.</p><button id="enter">Bắt đầu học →</button></section>
<section id="app" class="hidden"><div class="panel"><h2>🌼 Học vui mỗi ngày</h2><div class="row"><label>Chọn lớp <select id="grade"><option value="1">Lớp 1</option><option value="2">Lớp 2</option><option value="3">Lớp 3</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option></select></label><label>Avatar <select id="avatar"><option value="thỏ">🐰 Bé Thỏ</option><option value="gấu">🐻 Bé Gấu</option><option value="gấu mèo">🦝 Bé Gấu Mèo</option></select></label></div><p id="progress"></p></div><div class="panel" id="lessons"></div><div class="panel hidden" id="quiz"><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p><button id="listen">🔊 Nghe lại câu hỏi</button> <button id="back">← Quay lại</button></div></section></main>
<footer>Phiên bản DEMO dựng lại độc lập; không nhập thông tin cá nhân hoặc mật khẩu thật.</footer>
<script>
const $=x=>document.getElementById(x), STORAGE='hocvui-demo-progress', bank={
1:[['3 + 4 bằng bao nhiêu?',['6','7','8'],1],['5 - 2 bằng bao nhiêu?',['2','3','4'],1],['Hello có nghĩa là gì?',['Xin chào','Tạm biệt','Cảm ơn'],0],['Con vật nào kêu meo meo?',['Chó','Mèo','Gà'],1]],
2:[['12 + 8 bằng bao nhiêu?',['18','20','22'],1],['3 nhân 4 bằng bao nhiêu?',['7','12','14'],1]],
3:[['9 nhân 6 bằng bao nhiêu?',['54','56','64'],0]],
4:[['125 + 375 bằng bao nhiêu?',['400','500','600'],1]],
5:[['0,5 + 0,25 bằng bao nhiêu?',['0,30','0,75','0,80'],1]]
};let done={};try{done=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{};let current=-1;
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.85;speechSynthesis.speak(u)}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=850;g.gain.value=.04;o.start();o.stop(a.currentTime+.13)}catch{}}
function render(){const grade=$('grade').value,items=bank[grade].map((a,i)=>({a,i,ok:!!done[grade+'-'+i]})).sort((a,b)=>Number(a.ok)-Number(b.ok));$('progress').textContent='Hoàn thành '+items.filter(x=>x.ok).length+'/'+items.length+' câu mẫu.';$('lessons').replaceChildren();let heading=document.createElement('h2');heading.textContent='Bài học';$('lessons').append(heading);for(const x of items){let e=document.createElement('div'),txt=document.createElement('span'),b=document.createElement('button');e.className='lesson';txt.textContent=(x.ok?'✅ ':'📘 ')+x.a[0];b.textContent=x.ok?'Làm lại':'Bắt đầu';b.onclick=()=>start(x.i);e.append(txt,b);$('lessons').append(e)}$('lessons').classList.remove('hidden');$('quiz').classList.add('hidden')}
function start(i){current=i;let x=bank[$('grade').value][i];$('question').textContent=x[0];$('feedback').textContent='';$('answers').replaceChildren();x[1].forEach((answer,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>choose(j);$('answers').append(b)});$('lessons').classList.add('hidden');$('quiz').classList.remove('hidden');speak(x[0])}
function choose(j){let grade=$('grade').value,x=bank[grade][current],ok=j===x[2];for(const [i,b] of [...$('answers').children].entries()){b.disabled=true;if(i===x[2])b.classList.add('correct');else if(i===j)b.classList.add('wrong')}let msg=ok?'Giỏi lắm, bé '+$('avatar').value+'! Con đã trả lời đúng!':'Tiếc quá, đáp án đúng là '+x[1][x[2]]+'. Bé '+$('avatar').value+' thử lại nhé!';$('feedback').textContent=msg;speak(msg);if(ok){beep();done[grade+'-'+current]=true;localStorage.setItem(STORAGE,JSON.stringify(done))}}
$('enter').onclick=()=>{$('welcome').classList.add('hidden');$('app').classList.remove('hidden');render()};$('grade').onchange=render;$('back').onclick=render;$('listen').onclick=()=>speak(bank[$('grade').value][current][0]);$('theme').onclick=()=>{document.body.style.background=document.body.style.background==='rgb(20, 39, 59)'?'#e9f9f2':'#14273b'};
</script></body></html>
